kind = "mobile"
previewPath = "/"
title = "Secure Vault"
version = "1.0.0"
id = "artifacts/secure-vault"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20287

[services.development]
run = "pnpm --filter @workspace/secure-vault run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/secure-vault", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/secure-vault", "run", "serve" ]

[services.env]
PORT = "20287"
BASE_PATH = "/"
